<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 审批服务</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="login.css"><script src="icons.js" defer></script><script src="shared.js" defer></script><script src="login.js" defer></script></head><body><main class="login-page"><div class="login-shell"><section class="login-intro"><img src="assets/company-logo.png" alt="智云科技"><div class="login-brand">审批服务</div><div class="eyebrow">APPROVAL WORKSPACE</div><h1>让每一次审批<br>有序流转，清晰留痕</h1><p>业务系统提交单据，审批服务负责流转。<br>流程设计、待办处理、结果回写，统一管理。</p><div class="login-tags"><span>多种审批规则</span><span>电脑与手机审批</span><span>全流程操作记录</span></div></section><section class="login-form"><span class="eyebrow">ACCOUNT LOGIN</span><h2>登录</h2><p class="muted">使用审批服务的账号登录。</p><form id="login-form"><label class="field">账号<input class="inp" name="account" autocomplete="off" required placeholder="输入工号或账号"></label><label class="field">密码<div class="password-wrap"><input class="inp" name="password" type="password" autocomplete="off" required minlength="6" placeholder="输入演示密码（至少 6 位）"><button class="icon-btn" type="button" id="toggle-password" aria-label="显示密码"></button></div></label><div class="login-row"><label class="check"><input type="checkbox">7 天内自动登录</label><button type="button" class="btn ghost sm" id="forgot-password">忘记密码？</button></div><button class="btn primary wide" type="submit">登录</button></form><div class="login-or">或</div><button class="btn wide" id="sso">使用公司统一认证登录</button><div class="login-example"><p>本地原型，不校验或保存真实账号密码</p><div class="toolbar"><button class="btn sm" data-role="管理员">管理员演示</button><button class="btn sm" data-role="审批人">审批人演示</button></div><button class="btn ghost sm" id="first-password">预览首次修改密码</button></div></section></div><footer>© 2026 智云科技 · 审批服务交互原型</footer></main></body></html>
